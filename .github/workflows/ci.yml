name: .NET Enterprise CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore StudentManagementSystem.sln

      - name: Build Solution (Release)
        run: dotnet build StudentManagementSystem.sln --configuration Release --no-restore

      - name: Execute Automated Unit Tests (Release)
        run: dotnet test StudentManagementSystem.sln --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"
